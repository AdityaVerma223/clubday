name: ClubDay daily reminders

on:
  schedule:
    - cron: "30 1 * * *" # 07:00 Asia/Kolkata
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Create due ClubDay reminders
        env:
          CLUBDAY_APP_URL: ${{ secrets.CLUBDAY_APP_URL }}
          JOBS_TOKEN: ${{ secrets.JOBS_TOKEN }}
        run: |
          test -n "$CLUBDAY_APP_URL" || (echo "Missing CLUBDAY_APP_URL secret" && exit 1)
          test -n "$JOBS_TOKEN" || (echo "Missing JOBS_TOKEN secret" && exit 1)
          curl --fail-with-body --silent --show-error \
            --request POST "$CLUBDAY_APP_URL/api/jobs/daily-reminders" \
            --header "Authorization: Bearer $JOBS_TOKEN"
